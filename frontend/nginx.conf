# Frontend Angular + reverse proxy (même origine => pas de CORS côté navigateur)
#   /gw/...   -> API Gateway (Spring Cloud Gateway, sécurité JWT centralisée)
#   /auth/... -> Keycloak (login / token)
#   /swagger-ui.html, /docs/... -> Swagger centralisé de la gateway
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Résolution DNS Docker dynamique (les conteneurs peuvent redémarrer avec une autre IP)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway  http://gateway:8088;
    set $keycloak http://keycloak:8080;

    client_max_body_size 20m;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Les actuators ne sont jamais exposés publiquement
    location ~ ^/gw/(.*/)?actuator { return 404; }

    location /gw/ {
        rewrite ^/gw/(.*)$ /$1 break;
        proxy_pass $gateway;
    }

    location /auth/ {
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $keycloak;
    }

    # Swagger centralisé (servi par la gateway)
    location ~ ^/(swagger-ui\.html|swagger-ui/|webjars/|v3/api-docs|docs/) {
        proxy_pass $gateway;
    }

    # Racine : app Angular (redirige vers /services côté client)
    location = / {
        try_files /index.csr.html =404;
    }

    # Application Angular (routes prérendues puis fallback SPA)
    location / {
        try_files $uri $uri/index.html /index.csr.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
