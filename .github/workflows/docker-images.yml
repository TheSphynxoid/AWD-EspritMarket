name: Docker images

# Construit toutes les images sur les runners GitHub (rien à builder en local).
# - Pull request : build uniquement (vérifie que tout compile).
# - Push sur main : build + publication sur GHCR (ghcr.io/<owner>/awd-espritmarket-<service>).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: discovery, context: backend/discovery }
          - { name: gateway, context: backend/gateway }
          - { name: user, context: backend/microservices/User }
          - { name: srv, context: backend/microservices/SRV }
          - { name: marketplace, context: backend/microservices/marketplace }
          - { name: delivery, context: backend/microservices/Delivery }
          - { name: event, context: backend/microservices/Event }
          - { name: partnership, context: backend/microservices/Partnership }
          - { name: notification, context: backend/microservices/Notification }
          - { name: frontend, context: frontend }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/awd-espritmarket-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
