spring.application.name=gateway
server.port=8088
#EUREKA_Registery
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#Log routes
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# Eureka : en Docker, enregistrer l'IP du conteneur (hostname non résolvable)
eureka.instance.prefer-ip-address=true

# CORS (origines séparées par des virgules) — en Docker le frontend passe par nginx (même origine)
gateway.cors.allowed-origins=${GATEWAY_CORS_ORIGINS:http://localhost:4200}

# Sécurité : validation des JWT Keycloak (signature via le JWK set du realm)
keycloak.auth-server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:espritmarket}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs}

# Swagger centralisé : http://localhost:8088/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=srv
springdoc.swagger-ui.urls[0].url=/docs/srv
springdoc.swagger-ui.urls[1].name=marketplace
springdoc.swagger-ui.urls[1].url=/docs/marketplace
springdoc.swagger-ui.urls[2].name=delivery
springdoc.swagger-ui.urls[2].url=/docs/delivery
springdoc.swagger-ui.urls[3].name=event
springdoc.swagger-ui.urls[3].url=/docs/event
springdoc.swagger-ui.urls[4].name=partnership
springdoc.swagger-ui.urls[4].url=/docs/partnership
springdoc.swagger-ui.urls[5].name=user
springdoc.swagger-ui.urls[5].url=/docs/user

# Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
