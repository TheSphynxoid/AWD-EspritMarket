spring.application.name=marketplace
server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=baha

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#EUREKA_Registery
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Communication avec le microservice Delivery (lecture seule cote marketplace)
# En prod via Eureka : http://Delivery  ; en direct : http://localhost:8084
delivery.service.url=${DELIVERY_SERVICE_URL:http://Delivery}

# RabbitMQ (pour notification shop.created)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}