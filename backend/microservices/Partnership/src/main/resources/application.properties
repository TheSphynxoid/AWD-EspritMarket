spring.application.name=Patnership
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/awd-Partnership}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:badis}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8089



eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Prometheus (scrapé sur le réseau interne Docker)
management.endpoints.web.exposure.include=health,info,prometheus

# Swagger : servers des docs (ex. /gw derrière nginx) — utilisé par le Swagger centralisé de la gateway
openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8088}

# ===== OpenFeign configuration =====
# Feign logging level: NONE | BASIC | HEADERS | FULL
spring.cloud.openfeign.client.config.default.logger-level=basic
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Enable DEBUG logging for the Feign client package to see Feign BASIC logs
logging.level.net.thesphynx.patnership.feignclient=DEBUG

# ===== RabbitMQ configuration =====
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Custom Exchange & Queues for Partnership events (e.g. nouvelle candidature / offre)
partnership.rabbitmq.exchange=partnership.exchange
partnership.rabbitmq.queue.application=partnership.application.queue
partnership.rabbitmq.routing-key.application=partnership.application.created

