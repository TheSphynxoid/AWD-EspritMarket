spring.application.name=Delivery
server.port=8084

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/awd-delivery}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:badis}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# RabbitMQ (conteneur "rabbitmq" du docker-compose)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Messages d'erreur lisibles dans les réponses HTTP (404, 409, validation 400)
server.error.include-message=always
server.error.include-binding-errors=always

# Prometheus (scrapé sur le réseau interne Docker)
management.endpoints.web.exposure.include=health,info,prometheus

# Swagger : servers des docs (ex. /gw derrière nginx) — utilisé par le Swagger centralisé de la gateway
openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8088}
