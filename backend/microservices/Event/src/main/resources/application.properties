spring.application.name=event
server.port=8085

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/awd-event}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:badis}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true


# Prometheus (scrapé sur le réseau interne Docker)
management.endpoints.web.exposure.include=health,info,prometheus

# Swagger : servers des docs (ex. /gw derrière nginx) — utilisé par le Swagger centralisé de la gateway
openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8088}
