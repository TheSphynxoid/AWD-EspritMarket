spring.application.name=USER
server.port=8087

# Eureka
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Keycloak (OAuth2 Resource Server - JWT validation)
keycloak.auth-server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:espritmarket}
keycloak.resource=${KEYCLOAK_CLIENT_ID:user-service}
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG


# Prometheus (scrapé sur le réseau interne Docker)
management.endpoints.web.exposure.include=health,info,prometheus

# Swagger : servers des docs (ex. /gw derrière nginx) — utilisé par le Swagger centralisé de la gateway
openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8088}
